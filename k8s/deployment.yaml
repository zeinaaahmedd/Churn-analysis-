apiVersion: apps/v1
kind: Deployment
metadata:
  name: churn-analysis
spec:
  replicas: 2
  selector:
    matchLabels:
      app: churn-analysis
  template:
    metadata:
      labels:
        app: churn-analysis
    spec:
      containers:
        - name: churn-analysis
          image: your-docker-registry/churn-analysis:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: PORT
              value: "8000"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20